<!DOCTYPE html>
<html>
<head>
  <title>Caza Estrellas</title>
  <link rel="stylesheet" href="limones.css"/>
  <script src="utils.js"></script>
</head>

<body onload="iniciar()">

  <div class="contenedor">

    <header class="encabezado">
      <img src="limon.png" class="logo" alt="Logo del juego"/>
      <div class="etiqueta">🍋 JUEGO ARCADE</div>

      <h1>Atrapar Limones</h1>

      <p>Si del cielo te caen limones... ¡atrápalos!</p>

      <h2>Autor: Liam Morales</h2>
    </header>

    <main class="zona-juego">

      <div class="barra-superior">

        <div class="indicador">
          <span class="icono">🏆</span>

          <div>
            <span class="etiqueta-indicador">PUNTAJE</span>
            <strong id="txtPuntaje">0</strong>
          </div>
        </div>

        <div class="indicador vidas">
          <span class="icono">❤️</span>

          <div>
            <span class="etiqueta-indicador">VIDAS</span>
            <strong id="txtVidas">3</strong>
          </div>
        </div>

      </div>

      <canvas id="areaJuego" width="600" height="400"></canvas>

      <div class="panel">
        <p>Usa los botones para mover tu personaje y atrapar los limones.</p>
      </div>

      <div class="botones">

        <button class="btn-movimiento" onclick="moverIzquierda()">
          ← Izquierda
        </button>

        <button class="btn-movimiento" onclick="moverDerecha()">
          Derecha →
        </button>

        <button class="btn-reiniciar" onclick="reiniciar()">
          ↻ Reiniciar
        </button>
        <button onclick="desaparecerPersonaje()">
          Desaparecer Personaje
        </button>

      </div>

    </main>

  </div>

  <script src="limones.js"></script>

</body>
</html>
